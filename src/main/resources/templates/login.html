<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkers beta 1.0</title>
    <link href="/styles/main.css" rel="stylesheet">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
    >
</head>
<body>
<nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <a href="/" class="navbar-brand">Checkers</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-4">
            <div class="card">
                <div class="card-body">
                    <form method="post" action="/login">
                        <div class="mb-3">
                            <h4 class="text-center">Войти</h4>
                        </div>

                        <div class="mb-3">
                            <label for="log-in" class="form-label">Имя пользователя</label>
                            <input type="text" name="login" class="form-control" id="log-in" placeholder="Имя пользователя">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Войти</button>

                            <a href="/" class="btn btn-outline-primary" role="button">Назад</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"
></script>
<script>
    const LOGIN_STORAGE_KEY = 'lastLogin';
    const loginForm = document.querySelector('form[action="/login"]');
    const loginInput = document.getElementById('log-in');

    // Восстановить сохранённый логин при загрузке страницы
    document.addEventListener('DOMContentLoaded', function () {
        try {
            const savedLogin = localStorage.getItem(LOGIN_STORAGE_KEY);
            if (savedLogin && loginInput) {
                loginInput.value = savedLogin;
            }
        } catch (e) {
            // localStorage недоступен — пропускаем восстановление без ошибок
        }
    });

    // Сохранить логин при отправке формы
    if (loginForm && loginInput) {
        loginForm.addEventListener('submit', function () {
            try {
                localStorage.setItem(LOGIN_STORAGE_KEY, loginInput.value);
            } catch (e) {
                // localStorage недоступен — пропускаем сохранение без ошибок
            }
        });
    }
</script>
</body>
</html>
