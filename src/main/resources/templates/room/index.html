<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkers beta 1.0</title>
    <link href="/styles/main.css" rel="stylesheet">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
    >
</head>
<body>
<nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
        <a href="/" class="navbar-brand">Checkers</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Доступные комнаты</h3>
                <a href="/room/create" class="btn btn-success">Создать игру</a>
            </div>

            <div class="card" th:if="${#lists.isEmpty(rooms)}">
                <div class="card-body text-center">
                    <p class="text-muted mb-0">Нет доступных комнат</p>
                </div>
            </div>

            <div class="card" th:unless="${#lists.isEmpty(rooms)}">
                <div class="card-body">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th scope="col">ID комнаты</th>
                            <th scope="col">Белые</th>
                            <th scope="col">Чёрные</th>
                            <th scope="col"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="room : ${rooms}">
                            <td th:text="${room.id}" class="align-middle fw-bold"></td>
                            <td class="align-middle">
                                <span th:if="${room.whitePlayer != null}" th:text="${room.whitePlayer}" class="badge bg-dark">Player</span>
                                <span th:unless="${room.whitePlayer != null}" class="badge bg-success">Свободно</span>
                            </td>
                            <td class="align-middle">
                                <span th:if="${room.blackPlayer != null}" th:text="${room.blackPlayer}" class="badge bg-dark">Player</span>
                                <span th:unless="${room.blackPlayer != null}" class="badge bg-success">Свободно</span>
                            </td>
                            <td class="align-middle text-end">
                                <form method="post" th:action="@{'/room/' + ${room.id} + '/join'}" style="display: inline;">
                                    <button type="submit" class="btn btn-primary btn-sm">Присоединиться</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"
></script>
</body>
</html>
